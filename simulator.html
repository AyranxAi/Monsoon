<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Monsoon 4 DoubleJet — Digital Twin</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9ecec;font-family:system-ui,sans-serif;touch-action:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}
  
  /* Layout: 3D view on top, controls on bottom */
  /* Clean studio sweep: neutral gradient, lighter where the product sits,
     softly darker toward the edges/bottom so the white body has contrast and
     doesn't blend into the background. (studio.png is kept only as the IBL
     reflection/light source, not as a flat 2D backdrop behind the 3D.) */
  #webgl-container{position:relative;flex:1;z-index:1;overflow:hidden;
    background:radial-gradient(135% 130% at 50% 30%, #eff2f4 0%, #d2d8dc 55%, #b4bdc2 100%);}
  #webgl{position:absolute;inset:0;touch-action:none;}
  #css3d{position:absolute;inset:0;z-index:2;pointer-events:none; touch-action:none;}
  #css3d iframe{border:0;background:transparent;pointer-events:auto;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;}

  /* UI Elements */
  .badge{position:fixed;right:12px;top:12px;z-index:5;color:#37494f;font-size:11px;letter-spacing:.04em;
        background:rgba(255,255,255,.82);padding:5px 10px;border-radius:7px;pointer-events:none;}
  /* top-left (i) info toggle — collapsed to a circle, expands to show the
     controls hint for 5s then collapses back for cleanliness. */
  #info{position:fixed;left:12px;top:12px;z-index:6;display:flex;align-items:center;gap:8px;}
  #info-btn{flex:none;width:26px;height:26px;border-radius:50%;border:none;cursor:pointer;padding:0;
        background:rgba(255,255,255,.85);color:#37494f;font:italic 600 14px Georgia,serif;line-height:26px;
        box-shadow:0 1px 3px rgba(0,0,0,.12);pointer-events:auto;}
  #info-msg{color:#445;font-size:12px;background:rgba(255,255,255,.9);padding:6px 11px;border-radius:8px;
        max-width:60vw;white-space:nowrap;pointer-events:none;opacity:0;transform:translateX(-6px);
        transition:opacity .18s ease,transform .18s ease;}
  #info.open #info-msg{opacity:1;transform:translateX(0);}
  @media (max-width:600px){ #info-msg{white-space:normal;} }
  #dbg{position:fixed;left:12px;top:12px;z-index:5;color:#0a3;font:10px ui-monospace,monospace;
        background:rgba(255,255,255,.85);padding:6px 10px;border-radius:7px;white-space:pre;pointer-events:none;display:none;}

  /* preset view buttons — float over the 3D so the render keeps full height.
     Container is transparent + pointer-events:none so drags around the pills
     still orbit the model; only the pills themselves capture clicks. */
  #views{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;gap:8px;padding:12px;
        justify-content:center;background:transparent;border-top:none;pointer-events:none;}
  #views button{pointer-events:auto;font:14px system-ui,sans-serif;color:#2a3b40;background:#fff;
        border:1px solid #c4cccd;border-radius:10px;padding:10px 16px;cursor:pointer;
        box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .15s,border-color .15s;flex:1;max-width:120px;}
  #views button:active{background:#f0f0f0;}
  #views button.active{background:#13827522;border-color:#138275;color:#0d5f55;font-weight:600;}

  /* Ensure bottom layout on mobile and landscape */
  @media (max-width: 600px), (orientation: landscape) {
    #app { flex-direction: column; }
    #views { flex-direction: row; width: 100%; border-top: none; }
    .badge { font-size: 10px; padding: 4px 8px; }
  }

  * {
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init(); eruda.hide();</script>

<div id="app">
  <div id="webgl-container">
    <div id="webgl"></div>
    <div id="css3d"></div>
    <div id="info">
      <button id="info-btn" type="button" aria-label="Controls help" title="Controls">i</button>
      <div id="info-msg">Drag to orbit · pinch to zoom · tap the knob</div>
    </div>
  </div>
  <div id="views">
    <button data-view="front">Front</button>
    <button data-view="tq">3-Quarter</button>
    <button data-view="ports">Gas Ports</button>
  </div>
</div>

<div class="badge">Monsoon 4 · DoubleJet</div>
<div id="dbg">loading…</div>

<script>
/* (i) info toggle: click to reveal the controls hint, auto-collapse after 5s */
(function(){
  var info = document.getElementById('info');
  var btn  = document.getElementById('info-btn');
  var timer = null;
  btn.addEventListener('click', function(e){
    e.stopPropagation();
    if(info.classList.contains('open')){
      info.classList.remove('open'); clearTimeout(timer); return;
    }
    info.classList.add('open');
    clearTimeout(timer);
    timer = setTimeout(function(){ info.classList.remove('open'); }, 5000);
  });
})();
</script>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls }              from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }                 from 'three/addons/loaders/GLTFLoader.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

const GLB        = 'monsoon4_doublejet.glb?t=' + Date.now();
const OVERLAY    = 'monsoon4_doublejet_overlay.html';
const HMI_W_PX   = 1902.1, HMI_H_PX = 1084.5;
const PWc        = 0.2608, PHc = 0.1487;
const PX2M       = PWc / HMI_W_PX;
const SURF_OFF   = 0.0016;

const dbg = document.getElementById('dbg');
const log = (...a)=>console.log('[djtwin]', ...a);
const container = document.getElementById('webgl-container');

/* ── WebGL renderer ── */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.LinearToneMapping;   // vivid like the Blender "Standard" look; ACES would desaturate the teal
renderer.toneMappingExposure = 0.9;
renderer.setClearAlpha(0);                          // let the studio.png CSS backdrop show through
renderer.domElement.style.touchAction = 'none';
document.getElementById('webgl').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = null;   // studio.png shows through as the CSS backdrop behind the model

const camera = new THREE.PerspectiveCamera(34, container.clientWidth/container.clientHeight, 0.01, 100);

/* ── Lighting: IBL from the white studio (studio.png) ──
   The bright room is baked into an environment map so the glossy white body
   and teal knob reflect it and read as shiny "new tech" instead of flat gray.
   Direct lights just add a key highlight + a bit of shape. */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
new THREE.TextureLoader().load('studio.png', (tex)=>{
  tex.mapping = THREE.EquirectangularReflectionMapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  scene.environment = pmrem.fromEquirectangular(tex).texture;
  tex.dispose(); pmrem.dispose();
  log('studio environment ready');
}, undefined, (e)=> log('studio env load failed', e));
scene.add(new THREE.HemisphereLight(0xffffff, 0x9aa4a6, 0.35));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(0.5, 1.2, 0.9); scene.add(key);
const fill= new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(-0.7, 0.5, -0.4); scene.add(fill);

/* ── Controls ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 0.30; controls.maxDistance = 1.6;
controls.minPolarAngle = THREE.MathUtils.degToRad(28);
controls.maxPolarAngle = THREE.MathUtils.degToRad(90);

/* ── CSS3D renderer ── */
const css3d = new CSS3DRenderer(); 
css3d.setSize(container.clientWidth, container.clientHeight);
document.getElementById('css3d').appendChild(css3d.domElement);
css3d.domElement.style.pointerEvents = 'none';

/* ── Views ── */
let target = new THREE.Vector3(0, 0.20, 0.12);
  const getScale = () => {
    const aspect = container.clientWidth / container.clientHeight;
    // On mobile/narrow screens (aspect < 1), we need to zoom out more.
    // Base scale is 1.0 for landscape/desktop.
    // For portrait mobile (e.g. aspect 0.5), we increase distance.
    if (aspect < 1.0) {
      return 1.0 + (1.0 - aspect) * 1.5; // Dynamic scaling based on narrowness
    }
    return 1.0;
  };

  const VIEWS = {
    hero:  [   0, 70, 0.98 ],   // wide default: whole unit incl. feet; unlabeled (no button highlighted)
    front: [   0, 66, 0.62 ],
    tq:    [ -32, 60, 0.66 ],
    ports: [   6, 84, 0.50 ],
  };
let camAnim = null;
let currentViewName = 'hero';
  function setView(name, instant){
    currentViewName = name;
    const v = VIEWS[name] || VIEWS.front;
    const a = THREE.MathUtils.degToRad(v[0]), p = THREE.MathUtils.degToRad(v[1]), d = v[2] * getScale();
    const dest = new THREE.Vector3(
      target.x + d*Math.sin(p)*Math.sin(a),
      target.y + d*Math.cos(p),
      target.z + d*Math.sin(p)*Math.cos(a)
    );
    document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
    if(instant){ camera.position.copy(dest); controls.update(); return; }
    camAnim = { from: camera.position.clone(), to: dest, t: 0 };
  }
document.querySelectorAll('#views button').forEach(b=>{
  b.addEventListener('click', ()=> setView(b.dataset.view));
});

/* ── Load Model ── */
const pickables = [];
let knobNode = null;
let overlayNormal = null;
let overlayObj = null;
let knobBaseScale = new THREE.Vector3(1,1,1);
let knobMeshes = [];
let hmiWin = null;

new GLTFLoader().load(GLB, (gltf)=>{
 try {
  const model = gltf.scene;
  const named = {};
  model.traverse(o=>{
    if(o.name) named[o.name] = o;
    if(o.isMesh && o.material){
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach(m=>{
        const c = m.color;
        const lum = c ? (0.2126*c.r + 0.7152*c.g + 0.0722*c.b) : 1;
        // Dark surfaces (control panel, screen, feet) ignore the bright studio
        // env so they stay a rich charcoal instead of washing out to grey.
        // Light surfaces (white body, teal knob, colored rings) keep the full
        // reflection so they read glossy/new.
        m.envMapIntensity = (lum < 0.12) ? 0.05 : 0.7;
        m.needsUpdate = true;
      });
    }
  });
  scene.add(model);

  ['BTN_jet','BTN_laser','BTN_mode'].forEach(n=>{ if(named[n]) named[n].visible = false; });

  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  target.copy(center); controls.target.copy(center);

  /* logo is now baked into the GLB (LBL_logo); no HTML decal needed */

  /* ── Overlay Placement ── */
  const anchor = named['SCREEN_anchor'];
  if(anchor){
    anchor.updateWorldMatrix(true, false);
    const aPos = anchor.getWorldPosition(new THREE.Vector3());
    const aQuat = anchor.getWorldQuaternion(new THREE.Quaternion());
    const corr = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
    const oQuat = aQuat.clone().multiply(corr);
    const normal = new THREE.Vector3(0,0,1).applyQuaternion(oQuat).normalize();

    const iframe = document.createElement('iframe');
    iframe.src = OVERLAY + '?cache_bust=' + Math.random().toString(36).substring(7);
    iframe.style.width = HMI_W_PX + 'px';
    iframe.style.height = HMI_H_PX + 'px';
    iframe.setAttribute('allowtransparency', 'true');
    iframe.addEventListener('load', ()=>{ hmiWin = iframe.contentWindow; });

    const obj = new CSS3DObject(iframe);
    obj.scale.setScalar(PX2M);
    obj.position.copy(aPos).addScaledVector(normal, SURF_OFF);
    obj.quaternion.copy(oQuat);
    scene.add(obj);
    overlayObj = obj;
    overlayNormal = normal.clone();
  }

  knobNode = named['Knob'];
  if(knobNode){
    knobBaseScale.copy(knobNode.scale);
    knobNode.traverse(o=>{
      if(o.isMesh){
        o.userData.kind='knob';
        pickables.push(o);
        knobMeshes.push(o);
        // The knob sits in the dark panel, so a full studio reflection makes it
        // glow unnaturally. Dial its env reflection down so it's lit mostly by
        // the key light -> natural top-lit gradient with a darker underside.
        if(o.material){ o.material.envMapIntensity = 0.22; o.material.needsUpdate = true; }
      }
    });
  }

  setView('hero', true);
 } catch(err) { log('SETUP ERROR', err); }
}, undefined, (err)=> log('LOAD ERROR', err));

/* ── Interaction ── */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let knobDown = null;
let knobPressAnim = null, knobGlowAnim = null;

function hmiSend(act, extra){
  if(hmiWin) hmiWin.postMessage(Object.assign({ ch:'ms4', act }, extra||{}), '*');
}

function getClientXY(ev){
  return { x: ev.clientX, y: ev.clientY };
}

function pick(ev){
  if(!pickables.length) return null;
  const { x, y } = getClientXY(ev);
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((x - r.left) / r.width)  *  2 - 1;
  ndc.y = -((y - r.top)  / r.height) *  2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}

window.addEventListener('message', ev=>{
  const m = ev.data;
  if(!m || m.ch !== 'ms4' || m.act !== 'bgtap' || !overlayObj) return;
  const halfW = HMI_W_PX/2, halfH = HMI_H_PX/2;
  const local = new THREE.Vector3((m.x-halfW)*PX2M, (halfH-m.y)*PX2M, 0);
  local.applyQuaternion(overlayObj.quaternion);
  const world = overlayObj.position.clone().add(local);
  const ndcPoint = world.clone().project(camera);
  ndc.set(ndcPoint.x, ndcPoint.y);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  if(hits.length && hits[0].object.userData.kind === 'knob'){
    hmiSend('tap', { id: 'knob' });
    knobPressAnim = { t: 0 }; knobGlowAnim = { t: 0 };
  }
});

renderer.domElement.addEventListener('pointerdown', ev=>{
  knobDown = null;
  const o = pick(ev);
  if(o && o.userData.kind === 'knob'){
    controls.enabled = false;
    ev.stopPropagation();
    knobDown = getClientXY(ev);
  }
}, { capture: true });

window.addEventListener('pointerup', ev=>{
  if(knobDown){
    controls.enabled = true;
    const { x, y } = getClientXY(ev);
    if(Math.hypot(x - knobDown.x, y - knobDown.y) < 10){
      hmiSend('tap', { id: 'knob' });
      knobPressAnim = { t: 0 }; knobGlowAnim = { t: 0 };
    }
    knobDown = null;
  }
});

  window.addEventListener('resize', ()=>{
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w/h; camera.updateProjectionMatrix();
    renderer.setSize(w, h); css3d.setSize(w, h);
    // Re-apply current view with new scale (works for the unlabeled hero view too)
    setView(currentViewName, true);
  });

(function tick(){
  if(camAnim){
    camAnim.t = Math.min(1, camAnim.t + 0.045);
    const k = camAnim.t<.5 ? 2*camAnim.t*camAnim.t : 1-Math.pow(-2*camAnim.t+2,2)/2;
    camera.position.lerpVectors(camAnim.from, camAnim.to, k);
    if(camAnim.t >= 1) camAnim = null;
  }
  if(knobPressAnim && knobNode){
    knobPressAnim.t = Math.min(1, knobPressAnim.t + 0.09);
    const s = 1 - 0.12*Math.sin(knobPressAnim.t*Math.PI);
    knobNode.scale.copy(knobBaseScale).multiplyScalar(s);
    if(knobPressAnim.t >= 1){ knobNode.scale.copy(knobBaseScale); knobPressAnim = null; }
  }
  if(knobGlowAnim && knobMeshes.length > 0){
    knobGlowAnim.t = Math.min(1, knobGlowAnim.t + 0.08);
    const glow = Math.sin(knobGlowAnim.t * Math.PI) * 0.8;
    knobMeshes.forEach(m => {
      if(m.material){
        m.material.emissive.setHex(0x00ccff);
        m.material.emissiveIntensity = glow;
        m.material.needsUpdate = true;
      }
    });
    if(knobGlowAnim.t >= 1) knobGlowAnim = null;
  }
  if(overlayObj && overlayNormal){
    const toCam = camera.position.clone().sub(overlayObj.position).normalize();
    const facing = toCam.dot(overlayNormal);
    const k = THREE.MathUtils.smoothstep(facing, -0.05, 0.15);
    overlayObj.element.style.opacity = k;
    overlayObj.element.style.pointerEvents = k > 0.5 ? 'auto' : 'none';
  }
  controls.update();
  renderer.render(scene, camera);
  css3d.render(scene, camera);
  requestAnimationFrame(tick);
})();
window.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Monsoon 4 DoubleJet — Digital Twin (GLB body + live HMI)</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#e9ecec;font-family:system-ui,sans-serif;touch-action:none;}
  #app{position:fixed;inset:0;}
  /* touch-action:none on the canvas prevents the browser from intercepting
     touch events for scroll/zoom, ensuring our pointer events always fire */
  #webgl{position:absolute;inset:0;z-index:1;touch-action:none;}
  /* CSS3D layer is click-through by default; the overlay iframe re-enables itself
     so its buttons/chevrons work and empty-panel clicks fall through to the canvas. */
  #css3d{position:absolute;inset:0;z-index:2;pointer-events:none; touch-action:none;}
  #css3d iframe{border:0;background:transparent;pointer-events:auto;}

  .badge{position:fixed;right:12px;top:12px;z-index:5;color:#37494f;font-size:12px;letter-spacing:.04em;
        background:rgba(255,255,255,.82);padding:5px 10px;border-radius:7px;pointer-events:none;}
  .hint{position:fixed;left:12px;bottom:12px;z-index:5;color:#445;font-size:13px;
        background:rgba(255,255,255,.82);padding:6px 11px;border-radius:8px;pointer-events:none;}
  #dbg{position:fixed;left:12px;top:12px;z-index:5;color:#0a3;font:12px ui-monospace,monospace;
        background:rgba(255,255,255,.85);padding:6px 10px;border-radius:7px;white-space:pre;pointer-events:none;}

  /* preset view buttons */
  #views{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:flex;gap:8px;}
  #views button{font:13px system-ui,sans-serif;color:#2a3b40;background:rgba(255,255,255,.9);
        border:1px solid #c4cccd;border-radius:8px;padding:7px 14px;cursor:pointer;
        box-shadow:0 1px 3px rgba(0,0,0,.08);transition:background .15s,border-color .15s;}
  #views button:hover{background:#fff;border-color:#9fb6bb;}
  #views button.active{background:#13827522;border-color:#138275;color:#0d5f55;font-weight:600;}

  * {
    -webkit-touch-callout: none !important;
    -webkit-user-select: none !important;
    user-select: none !important;
  }
</style>
</head>
<body>
<!-- DIAGNOSTIC: eruda gives a mobile-friendly DevTools console (Console/Elements/Network)
     directly on-page, no F12 / no second computer needed. Tap the floating circle button
     bottom-right to open it. Remove this script tag once debugging is done. -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>eruda.init();</script>
<div id="app"><div id="webgl"></div><div id="css3d"></div></div>
<div class="badge">Monsoon 4 · DoubleJet — Digital Twin</div>
<div class="hint">Drag empty space to orbit · scroll to zoom · click the buttons / chevrons · tap the knob</div>
<div id="dbg">loading…</div>
<div id="views">
  <button data-view="front">Front</button>
  <button data-view="tq">3-Quarter</button>
  <button data-view="ports">Gas Ports</button>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls }              from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader }                 from 'three/addons/loaders/GLTFLoader.js';
import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';

/* ═══════════════════════════════════════════════════════════════════════════
   DoubleJet digital twin — "mask with the HTML".
   • 3D (WebGL): the GLB body + matte bezel (SCREEN_panel) + grey screen rect
     (SCREEN_display) + the user's hand-made dome Knob.
   • HTML (CSS3D): monsoon4_doublejet_overlay.html mapped 1:1 onto the content
     frame so the live screen lands on SCREEN_display, the flat buttons + ‹ ›
     chevrons land at their HMI %, and the hidden HTML knob's tap handler is
     driven by the 3D Knob via postMessage.
   The master monsoon4_doublejet.html stays untouched & fully editable.
   ═══════════════════════════════════════════════════════════════════════════ */
const GLB        = 'monsoon4_doublejet.glb?t=' + Date.now();   // cache-bust re-exports
const OVERLAY    = 'monsoon4_doublejet_overlay.html';
const HMI_W_PX   = 1902.1, HMI_H_PX = 1084.5;   // HMI reference pixel size (aspect 1.754)
const PWc        = 0.2608, PHc = 0.1487;        // content-frame size in metres (== full HMI rect)
const PX2M       = PWc / HMI_W_PX;              // exact px→world scale (== PHc/HMI_H_PX)
const SURF_OFF   = 0.0016;                       // push the overlay just in front of the panel face

const dbg = document.getElementById('dbg');
const log = (...a)=>console.log('[djtwin]', ...a);

/* ── WebGL renderer (flat, matte, no harsh glare — medical, glare-sensitive user) ── */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
/* touch-action:none on the canvas element itself prevents iOS/Android from
   intercepting pointer events for native scroll/pinch-zoom gestures */
renderer.domElement.style.touchAction = 'none';
document.getElementById('webgl').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xe9ecec);

const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, 0.01, 100);

/* ── soft, flat lighting: hemisphere + two gentle directionals, no specular blowout ── */
scene.add(new THREE.HemisphereLight(0xffffff, 0x97a1a3, 0.95));
const key = new THREE.DirectionalLight(0xffffff, 0.55); key.position.set(0.5, 1.2, 0.9); scene.add(key);
const fill= new THREE.DirectionalLight(0xffffff, 0.22); fill.position.set(-0.7, 0.5, -0.4); scene.add(fill);

/* ── LIMITED orbit (can't flip under; screen stays readable) ── */
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.enablePan = false;
controls.minDistance = 0.30; controls.maxDistance = 1.6;
controls.minPolarAngle = THREE.MathUtils.degToRad(28);
controls.maxPolarAngle = THREE.MathUtils.degToRad(90);

/* ── CSS3D renderer (overlay layer) ── */
const css3d = new CSS3DRenderer(); css3d.setSize(innerWidth, innerHeight);
document.getElementById('css3d').appendChild(css3d.domElement);
css3d.domElement.style.pointerEvents = 'none';

/* ── preset views: animate azimuth°/polar°/distance about the target ── */
let target = new THREE.Vector3(0, 0.20, 0.12);
const VIEWS = {
  front: [   0, 66, 0.62 ],   // straight front, slightly above — reads the screen
  tq:    [ -32, 60, 0.66 ],   // three-quarter
  ports: [   6, 84, 0.50 ],   // low & close on the gas-connector row
};
let camAnim = null;
function setView(name, instant){
  const v = VIEWS[name] || VIEWS.front;
  const a = THREE.MathUtils.degToRad(v[0]), p = THREE.MathUtils.degToRad(v[1]), d = v[2];
  const dest = new THREE.Vector3(
    target.x + d*Math.sin(p)*Math.sin(a),
    target.y + d*Math.cos(p),
    target.z + d*Math.sin(p)*Math.cos(a)
  );
  document.querySelectorAll('#views button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  if(instant){ camera.position.copy(dest); controls.update(); return; }
  camAnim = { from: camera.position.clone(), to: dest, t: 0 };
}
document.querySelectorAll('#views button').forEach(b=>{
  b.addEventListener('click', ()=> setView(b.dataset.view));
});

/* ── load the GLB body ── */
window.__THREE = THREE; window.__scene = scene; window.__camera = camera; window.__controls = controls; window.__renderer = renderer;
window.__frame = ()=>{ controls.update(); renderer.render(scene, camera); css3d.render(scene, camera); };   // debug: force one frame
const pickables = [];                 // only the 3D Knob is raycast (buttons/chevrons are HTML)
let knobNode = null;
let knobBaseScale = new THREE.Vector3(1,1,1);   // captured once GLB loads — animation multiplies THIS, never overwrites it

new GLTFLoader().load(GLB, (gltf)=>{
 try {
  const model = gltf.scene; window.__model = model;
  const named = {};
  model.traverse(o=>{
    if(o.name) named[o.name] = o;
    if(o.isMesh && o.material){ o.material.envMapIntensity = 0.4; o.material.needsUpdate = true; }
  });
  window.__named = named;
  scene.add(model);

  // the BTN_* meshes are HTML hit-proxies only → keep them out of the WebGL render
  ['BTN_jet','BTN_laser','BTN_mode'].forEach(n=>{ if(named[n]) named[n].visible = false; });

  // frame on the model
  const box = new THREE.Box3().setFromObject(model);
  const center = box.getCenter(new THREE.Vector3());
  const size   = box.getSize(new THREE.Vector3());
  target.copy(center); controls.target.copy(center);

  /* ── place the live HMI overlay on the content frame via SCREEN_anchor ── */
  const anchor = named['SCREEN_anchor'];
  if(anchor){
    anchor.updateWorldMatrix(true, false);
    const aPos = anchor.getWorldPosition(new THREE.Vector3());
    const aQuat = anchor.getWorldQuaternion(new THREE.Quaternion());
    // anchor maps local +Y → panel normal; a CSS3D plane's normal is local +Z.
    // Rotate −90° about X so the iframe (XY plane, +Z out) faces along the rake normal,
    // with HMI-up → up-the-rake and HMI-right → world +X.
    const corr = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1,0,0), -Math.PI/2);
    const oQuat = aQuat.clone().multiply(corr);
    const normal = new THREE.Vector3(0,0,1).applyQuaternion(oQuat).normalize();

    const iframe = document.createElement('iframe');
    iframe.src = OVERLAY + '?cache_bust=' + Math.random().toString(36).substring(7);   // cache-bust so overlay edits load fresh
    iframe.style.width = HMI_W_PX + 'px';
    iframe.style.height = HMI_H_PX + 'px';
    iframe.setAttribute('allowtransparency', 'true');
    iframe.addEventListener('load', ()=>{ hmiWin = iframe.contentWindow; });

    const obj = new CSS3DObject(iframe);
    obj.scale.setScalar(PX2M);
    obj.position.copy(aPos).addScaledVector(normal, SURF_OFF);
    obj.quaternion.copy(oQuat);
    scene.add(obj);
    window.__overlay = obj;
    log('OVERLAY anchor', aPos.toArray().map(v=>+v.toFixed(4)), 'normal', normal.toArray().map(v=>+v.toFixed(3)));
  } else {
    log('WARN: SCREEN_anchor not found — overlay not placed');
  }

  // the 3D dome knob is raycast for TAP
  knobNode = named['Knob'];
  if(knobNode){ 
    knobBaseScale.copy(knobNode.scale);   // remember whatever scale the GLB actually has, uniform or not
    knobNode.traverse(o=>{ 
      if(o.isMesh){ 
        o.userData.kind='knob'; 
        o.userData.id='knob'; // ensure the ID matches the HTML element
        pickables.push(o); 
      } 
    }); 
  }

  /* 3D turn chevrons were removed by request (visual preference) — the knob
     itself is still the only thing raycast; pickables now only ever
     contains its mesh(es). The dead 'turn' branch lower down in the
     pointerdown handler is harmless and left in place in case turning is
     reintroduced some other way later. */

  const startView = new URLSearchParams(location.search).get('view');
  setView((startView && VIEWS[startView]) ? startView : 'front', true);
  window.setView = setView;

  const report = {
    nodes: Object.keys(named).length,
    size: size.toArray().map(v=>+v.toFixed(4)),
    anchor: named['SCREEN_anchor'] ? named['SCREEN_anchor'].getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(4)) : null,
    knob: knobNode ? knobNode.getWorldPosition(new THREE.Vector3()).toArray().map(v=>+v.toFixed(4)) : null,
    pickables: pickables.length,
  };
  log('GEOMETRY', JSON.stringify(report));
  dbg.textContent =
    `loaded ✓  nodes:${report.nodes}  pickables:${report.pickables}\n`+
    `size(m): ${report.size.join(', ')}\n`+
    `knob:    ${report.knob ? report.knob.join(', ') : '— NOT FOUND'}`;
 } catch(setupErr) {
  log('SETUP ERROR (model loaded but interactivity setup crashed)', setupErr);
  dbg.textContent = 'SETUP ERROR: ' + (setupErr && setupErr.message ? setupErr.message : setupErr) +
    '\n(model may be visible but nothing will be tappable)';
 }
}, undefined, (err)=>{
  log('LOAD ERROR', err);
  dbg.textContent = 'LOAD ERROR: ' + (err && err.message ? err.message : err);
});

/* ══════════════════════════════════════════════════════════════════════════
   INTERACTION — knob tap + chevron click, desktop AND mobile touch.

   ROOT CAUSE FIXES:
   1. OrbitControls conflict: OrbitControls listens to pointerdown on the same
      canvas element. If we don't stop it, it captures the pointer and our
      pointerup never fires for knob/chevron hits.
      FIX: use { capture: true } so our listener runs FIRST in the capture
      phase, then call ev.stopPropagation() to prevent OrbitControls from
      seeing the event at all when we hit a pickable.

   2. Touch coordinate handling: PointerEvent always has clientX/Y for touch
      (unlike TouchEvent). However on some mobile browsers the first pointer
      event may have stale coordinates. We normalise via getClientXY().

   3. Tap threshold: increased to 10px (from 6px) for touch-friendly tapping.

   4. pointercancel: handles system interruptions (incoming call, scroll, etc.)
      on mobile — always re-enables orbit and clears state.
   ══════════════════════════════════════════════════════════════════════════ */
let hmiWin = null;
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let knobDown = null, turning = false;
let knobPressAnim = null;   // transient {t:0..1} — drives the knob "press" scale pulse

function hmiSend(act, extra){
  console.log('[djtwin] hmiSend', act, extra, 'hmiWin ready?', !!hmiWin);
  if(hmiWin) hmiWin.postMessage(Object.assign({ ch:'ms4', act }, extra||{}), '*');
}

/* Normalise pointer coordinates — works for mouse, pen, and touch PointerEvents */
function getClientXY(ev){
  // PointerEvent always carries clientX/Y even for touch pointers
  // Guard against the rare case of (0,0) on first touch by checking pointerId
  if(ev.clientX !== undefined && ev.clientY !== undefined){
    return { x: ev.clientX, y: ev.clientY };
  }
  // Fallback for legacy TouchEvent (should not occur with pointer-event listeners)
  if(ev.touches && ev.touches.length > 0){
    return { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
  }
  return { x: 0, y: 0 };
}

function pick(ev){
  if(!pickables.length) return null;
  const { x, y } = getClientXY(ev);
  const r = renderer.domElement.getBoundingClientRect();
  ndc.x = ((x - r.left) / r.width)  *  2 - 1;
  ndc.y = -((y - r.top)  / r.height) *  2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object : null;
}

function spinKnob(dir){
  if(knobNode) knobNode.rotateOnAxis(new THREE.Vector3(0,1,0), -dir*0.26);
}
function pulseKnob(){
  knobPressAnim = { t: 0 };   // tick() animates a quick press-and-release scale dip
}

/* ══════════════════════════════════════════════════════════════════════════
   BACKGROUND-TAP BRIDGE (knob only, for now) — the overlay iframe can never
   hand a real pointer event back to us once a tap lands inside its
   rectangle (hard iframe limit, not something CSS can route around), so
   instead it tells us WHERE a background tap landed in its own local pixel
   space, and we turn that back into a 3D ray ourselves, using the exact
   transform already used to place the overlay (window.__overlay), then
   raycast the same `pickables` the canvas-direct path already uses.
   ══════════════════════════════════════════════════════════════════════════ */
function overlayPxToWorld(px, py){
  const halfW = HMI_W_PX/2, halfH = HMI_H_PX/2;
  const local = new THREE.Vector3((px-halfW)*PX2M, (halfH-py)*PX2M, 0);
  local.applyQuaternion(window.__overlay.quaternion);
  return window.__overlay.position.clone().add(local);
}

window.addEventListener('message', ev=>{
  const m = ev.data;
  if(!m || m.ch !== 'ms4' || m.act !== 'bgtap') return;
  if(!window.__overlay || !pickables.length) return;
  const world = overlayPxToWorld(m.x, m.y);
  const ndcPoint = world.clone().project(camera);     // world point → NDC
  ndc.set(ndcPoint.x, ndcPoint.y);
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  const o = hits.length ? hits[0].object : null;
  log('bgtap -> world', world.toArray().map(v=>+v.toFixed(4)), 'hit:', o ? o.userData.kind : 'none');
  if(o && o.userData.kind === 'knob'){
    hmiSend('tap', { id: 'knob' });
    pulseKnob();
  }
  // chevrons intentionally left out of this path for now -- knob only, per scope
});

/* ══════════════════════════════════════════════════════════════════════════
   DIAGNOSTIC — proves WHERE a tap actually lands, without needing F12.
   Attached at window-level in the CAPTURE phase, so it fires for every single
   pointerdown anywhere on the page, REGARDLESS of which element the browser's
   hit-test decided is "on top" at that point (unlike the canvas-only knob
   listener below, which only fires if the canvas itself is the actual target).
   If ev.target reports the IFRAME instead of CANVAS while tapping over the
   knob, that proves the overlay is sitting in front of the 3D layer there.
   ══════════════════════════════════════════════════════════════════════════ */
window.addEventListener('pointerdown', ev=>{
  const r = renderer.domElement.getBoundingClientRect();
  const real = document.elementFromPoint(ev.clientX, ev.clientY);
  const info = {
    x: ev.clientX, y: ev.clientY,
    'ev.target': ev.target.tagName + (ev.target.id ? '#'+ev.target.id : '') + (ev.target===renderer.domElement ? ' (=canvas ✓)' : ''),
    elementFromPoint: real ? (real.tagName + (real.id ? '#'+real.id : '')) : null,
    canvasRect: { w: Math.round(r.width), h: Math.round(r.height) },
    pickablesAtThisTime: pickables.length,
  };
  console.log('[TAP-DIAGNOSTIC]', JSON.stringify(info));
  window.__lastTap = info;
}, { capture: true });

renderer.domElement.addEventListener('pointerdown', ev=>{
  knobDown = null; turning = false;
  const o = pick(ev);
  if(!o) return;                     // no hit → let OrbitControls orbit normally

  const u = o.userData;

  if(u.kind === 'turn'){
    /* Chevron hit — disable orbit and stop the event so OrbitControls never
       sees it. Re-enable after a short delay (chevron action is instant). */
    controls.enabled = false;
    turning = true;
    ev.stopPropagation();            // ← prevents OrbitControls from starting orbit
    hmiSend('turn', { dir: u.dir });
    spinKnob(u.dir);
    setTimeout(()=>{ controls.enabled = true; turning = false; }, 150);

  } else if(u.kind === 'knob'){
    /* Knob hit — disable orbit while the finger is down so the knob press
       doesn't accidentally start an orbit gesture. */
    controls.enabled = false;
    ev.stopPropagation();            // ← prevents OrbitControls from starting orbit
    const { x, y } = getClientXY(ev);
    knobDown = { x, y };
  }
}, { capture: true });               // ← CRITICAL: capture phase runs before OrbitControls

/* ── pointerup (window level — catches the release even after stopPropagation) ── */
window.addEventListener('pointerup', ev=>{
  if(turning){ controls.enabled = true; turning = false; }
  if(knobDown){
    controls.enabled = true;         // always re-enable orbit on release
    const { x, y } = getClientXY(ev);
    const moved = Math.hypot(x - knobDown.x, y - knobDown.y);
    /* 10 px threshold — generous enough for a touch tap without false positives */
    if(moved < 10){
      hmiSend('tap', { id: 'knob' });
      pulseKnob();
    }
    knobDown = null;
  }
});

/* ── pointermove — handle hover effect ── */
let lastHovered = null;
window.addEventListener('pointermove', ev => {
  const o = pick(ev);
  if (o && o.userData.kind === 'knob') {
    if (lastHovered !== o) {
      if (lastHovered && lastHovered.material) {
        lastHovered.material.color.copy(lastHovered.userData.originalColor);
      }
      lastHovered = o;
      if (o.material) {
        o.material.color.copy(o.userData.hoverColor);
      }
      renderer.domElement.style.cursor = 'pointer';
    }
  } else {
    if (lastHovered) {
      if (lastHovered.material) {
        lastHovered.material.color.copy(lastHovered.userData.originalColor);
      }
      lastHovered = null;
      renderer.domElement.style.cursor = '';
    }
  }
});

/* ── pointercancel — system interruption (incoming call, scroll takeover, etc.) ── */
window.addEventListener('pointercancel', ()=>{
  controls.enabled = true;
  knobDown = null;
  turning  = false;
});

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); css3d.setSize(innerWidth, innerHeight);
});
(function tick(){
  if(camAnim){
    camAnim.t = Math.min(1, camAnim.t + 0.045);
    const k = camAnim.t<.5 ? 2*camAnim.t*camAnim.t : 1-Math.pow(-2*camAnim.t+2,2)/2; // easeInOutQuad
    camera.position.lerpVectors(camAnim.from, camAnim.to, k);
    if(camAnim.t >= 1) camAnim = null;
  }
  if(knobPressAnim && knobNode){
    knobPressAnim.t = Math.min(1, knobPressAnim.t + 0.09);
    const s = 1 - 0.12*Math.sin(knobPressAnim.t*Math.PI);   // quick dip down, smooth return — no overshoot
    knobNode.scale.copy(knobBaseScale).multiplyScalar(s);
    if(knobPressAnim.t >= 1){ knobNode.scale.copy(knobBaseScale); knobPressAnim = null; }
  }
  controls.update();
  renderer.render(scene, camera);
  css3d.render(scene, camera);
  requestAnimationFrame(tick);
})();

// APP-MODE LOCKDOWN: Disable context menu
window.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
